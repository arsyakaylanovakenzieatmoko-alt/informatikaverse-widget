<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InformatikaVerse</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#071B14;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

}

.card{

width:100%;

height:100vh;

background:linear-gradient(135deg,#0b6e4f,#02140f);

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

color:white;

text-align:center;

padding:40px;

}

h1{

font-size:70px;

font-weight:700;

color:#FFD54F;

margin-bottom:15px;

}

h2{

font-size:30px;

font-weight:500;

margin-bottom:20px;

}

p{

font-size:20px;

opacity:.9;

max-width:900px;

line-height:1.8;

}

.btn{

margin-top:40px;

padding:18px 50px;

border-radius:50px;

background:#FFD54F;

color:#000;

text-decoration:none;

font-size:22px;

font-weight:bold;

transition:.3s;

}

.btn:hover{

transform:scale(1.08);

box-shadow:0 0 30px gold;

}

</style>

</head>

<body>

<div class="card">

<h1>INFORMATIKAVERSE</h1>

<h2>Portal Pembelajaran Informatika</h2>

<p>

Selamat datang di Portal Pembelajaran Informatika

SMP Negeri Satap 6 Majenang.

Belajar lebih modern, interaktif, dan menyenangkan.

</p>

<a class="btn" href="#">🚀 MULAI BELAJAR</a>

</div>

</body>
</html>
